select{font:500 15px var(--f-body);padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}

code{font-family:var(--f-mono);font-size:13px;background:var(--chip);padding:1px 5px;border-radius:5px}

}
function reviewTask(x){return {key:x.key,kind:['write','puzzle'][Math.floor(Math.random()*2)],review:true,fails:0,revealed:false}}
function pickTask(){
  const now=Date.now(),words=allWords();
  const prog=words.filter(x=>state.w[x.key]&&state.w[x.key].s!=='done').sort((a,b)=>state.w[a.key].next-state.w[b.key].next);
  const ready=prog.filter(x=>state.w[x.key].next<=now);
  if(ready.length)return stageTask(ready[0]);
  const fresh=todayWords().find(x=>!state.w[x.key]);
  if(fresh){state.w[fresh.key]={s:1,next:now};return stageTask(fresh)}
  const learned=words.filter(x=>state.w[x.key]&&state.w[x.key].s==='done');
  const due=learned.filter(x=>state.w[x.key].due<=now).sort((a,b)=>state.w[a.key].due-state.w[b.key].due);
  if(due.length)return reviewTask(due[0]);
  if(prog.length)return stageTask(prog[0]);
  if(learned.length)return reviewTask(learned[Math.floor(Math.random()*learned.length)]);
  return reviewTask(todayWords()[0]);
}

function complete(t,note){
  const p=state.w[t.key],now=Date.now();let next='';
  if(p&&!t.review){
    if(t.revealed){p.next=now;next='Цей крок повториться наступного разу.'}
    else if(p.s<3){p.s++;p.next=now+state.gap*MIN;next='Наступний крок цього слова через '+fmtGap(state.gap)+'.'}
    else{p.s='done';p.lvl=0;p.due=now+DAY;next='Слово вивчене. Повторимо завтра.'}
  }else if(p){
    if(t.revealed){p.lvl=0;p.due=now+state.gap*MIN;next='Повторимо ще сьогодні.'}
    else{p.lvl=Math.min((p.lvl||0)+1,4);p.due=now+[1,3,7,14,30][p.lvl]*DAY;next='Наступне повторення '+fmtDate(p.due)+'.'}
  }
  state.solved++;lastResult={w:findWord(t.key),note,next};state.current=null;fb=null;view='success';save();render();
}
function fail(t,w){
  t.fails++;
  if(t.kind==='puzzle')t.placed=[];
  if(t.fails>=2&&!t.revealed&&t.kind!=='intro'){t.revealed=true;fb={cls:'bad',text:'Ось правильна відповідь. Повтори її, щоб пройти далі.'}}
  else if(t.kind==='intro')fb={cls:'bad',text:'Не те. Переклад написаний вище.'};
  else fb={cls:'bad',text:'Не те. Починається на «'+w.key[0]+'», '+w.key.length+' '+letters(w.key.length)+'.'};
  save();render();
  const c=$('#gate .card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  const inp=$('#ans');if(inp)inp.focus();
}

function updateMeta(){
  const learned=allWords().filter(x=>state.w[x.key]&&state.w[x.key].s==='done').length;
  $('#meta').textContent='слова дня № '+(dayNum()+1)+' · вивчено '+learned;
}
function fromLine(){
  const app=appName();
  return app?'<p class="from">Перед тим як відкрити <strong>'+esc(app)+'</strong>, одне слово.</p>':'<p class="from">Одне слово, і можна далі.</p>';
}
function render(){
  const now=Date.now(),gate=$('#gate');
  updateMeta();
  const paused=state.pausedUntil>now;
  $('#controls').hidden=paused;
  if(paused){
    const why=state.pauseReason==='call'?'Ти на дзвінку, тож слова не заважатимуть 30 хвилин.':'Слова вимкнені. Застосунки відкриваються без завдань.';
    gate.innerHTML='<div class="card done"><div class="lang">пауза</div><h2 class="done-title">До '+fmtTime(state.pausedUntil)+'</h2><p>'+why+'</p></div><button class="btn ghost" type="button" id="resume">Увімкнути зараз</button>';
    return;
  }
  if(view==='success'&&lastResult){
    const r=lastResult,app=appName();
    gate.innerHTML='<div class="card done"><div class="tick">'+ICON_CHECK+'</div><h2 class="done-title">Зараховано</h2><p>'+(app?esc(app)+' відкрито. Можна повертатися.':'Можна йти далі.')+'</p><p class="recap"><span lang="en">'+esc(r.w.key)+'</span> — '+esc(r.w.ua[0])+'</p>'+(r.note?'<p class="hint">'+esc(r.note)+'</p>':'')+'<p class="hint">'+esc(r.next)+'</p></div><button class="btn ghost" type="button" id="more">Ще одне слово</button>';
    return;
  }
  if(!state.current||!findWord(state.current.key)){state.current=pickTask();save()}
  renderTask(gate);
}
function renderTask(gate){
  const t=state.current,w=findWord(t.key);
  const n=t.kind==='intro'?1:t.kind==='write'?3:2;
  const label=t.review?'Повторення':'Крок '+n+' з 3 · '+['','знайомство','з літер','написання'][n];
  const dots=t.review?'':'<span class="dots">'+[1,2,3].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</span>';
  const listen='<button type="button" class="listen" data-say="'+esc(w.key)+'">'+ICON_SPEAK+'<span>Послухати</span></button>';
  let prompt,body;
  if(t.kind==='intro'){
    prompt='<div class="prompt"><div class="lang">нове слово</div><div class="word" lang="en">'+esc(w.key)+'</div><div class="row">'+listen+'</div><div class="gloss">'+esc(w.ua.join(', '))+'</div></div>';
  }else{
    prompt='<div class="prompt"><div class="lang">українською</div><div class="word">'+esc(w.ua[0])+'</div></div>';
  }
  const reveal=t.revealed?'<div class="reveal"><span class="lang">правильно</span><strong lang="en">'+esc(w.key)+'</strong>'+listen+'</div>':'';
  if(t.kind==='puzzle'){
    if(!t.tiles){t.tiles=shuffle(w.key.split(''));t.placed=[];save()}
    const slots=t.tiles.map((_,i)=>t.placed[i]!==undefined?'<span class="slot filled">'+esc(t.tiles[t.placed[i]])+'</span>':'<span class="slot"></span>').join('');
    const tiles=t.tiles.map((ch,i)=>'<button type="button" class="tile" data-i="'+i+'"'+(t.placed.includes(i)?' disabled':'')+' aria-label="Літера '+esc(ch)+'">'+esc(ch)+'</button>').join('');
    body='<p class="task">Склади слово англійською</p>'+reveal+'<div class="slots" aria-label="Твоє слово">'+slots+'</div><div class="tiles">'+tiles+'</div><div class="row"><button type="button" class="btn ghost small" id="undo">Стерти літеру</button></div>';
  }else{
    const en=t.kind!=='intro';
    const taskText=t.kind==='intro'?'Напиши переклад українською':'Напиши це слово англійською';
    body='<form id="f" class="answer-form" autocomplete="off"><label class="task" for="ans">'+taskText+'</label>'+reveal+
      '<input id="ans" class="answer" type="text" lang="'+(en?'en':'uk')+'" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="'+(en?'англійською':'українською')+'">'+
      '<button class="btn" type="submit">Перевірити</button></form>';
  }
  gate.innerHTML=fromLine()+'<div class="card"><div class="step"><span>'+label+'</span>'+dots+'</div>'+prompt+body+'<p class="feedback'+(fb?' '+fb.cls:'')+'" role="status">'+(fb?esc(fb.text):'')+'</p></div>';
}

/* sheets */
function openSheet(name){
  const b=$('#sheet-body');
  if(name==='off'){
    b.innerHTML='<h2>Вимкнути слова?</h2><p>Instagram, TikTok і Telegram відкриватимуться без завдань.</p><div class="stack"><button class="btn danger" type="button" data-off="1h">На 1 годину</button><button class="btn danger" type="button" data-off="morning">До ранку</button><button class="btn ghost" type="button" data-close>Залишити</button></div>';
  }else if(name==='dict'){
    const opt=(vals,cur,fmt)=>vals.map(v=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+fmt(v)+'</option>').join('');
    const li=x=>{
      const p=state.w[x.key];let chip='<span class="chip">нове</span>';
      if(p&&p.s==='done')chip='<span class="chip done">вивчено · '+fmtDate(p.due)+'</span>';
      else if(p)chip='<span class="chip go">крок '+p.s+' з 3</span>';
      return '<li><span class="li-en" lang="en">'+esc(x.en.join(' / '))+'</span><span class="li-ua">'+esc(x.ua.join(', '))+'</span>'+chip+'</li>';
    };
    const tw=todayWords(),twk=tw.map(x=>x.key);
    const mine=allWords().filter(x=>state.w[x.key]&&!twk.includes(x.key));
    b.innerHTML='<h2>Словник</h2><h3>Слова дня № '+(dayNum()+1)+' · '+fmtDate(Date.now())+'</h3><p class="hint">Сьогодні в усіх, хто вчить «Одне слово», ці самі два слова. Завтра будуть нові.</p><ul class="list">'+tw.map(li).join('')+'</ul>'+
      '<button class="btn" type="button" id="share">Поділитися з друзями</button><p class="feedback" id="share-fb" role="status"></p>'+
      '<div class="settings"><label for="gap">Між кроками одного слова</label><select id="gap">'+opt([15,30,60,120],state.gap,fmtGap)+'</select></div>'+
      '<form id="add" class="stack" autocomplete="off"><h3>Додати своє слово</h3><input id="add-en" class="answer" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="англійською, напр. thoughtful" aria-label="Слово англійською"><input id="add-ua" class="answer" lang="uk" placeholder="переклад, кілька через кому" aria-label="Переклад українською"><button class="btn" type="submit">Додати</button><p class="feedback" id="add-fb" role="status"></p></form>'+
      (mine.length?'<h3>Мої слова · '+mine.length+'</h3><ul class="list">'+mine.map(li).join('')+'</ul>':'')+
      '<button class="btn ghost" type="button" data-close>Закрити</button>';
  }else{
    b.innerHTML='<h2>Як підключити</h2><p>Сторінка відкривається сама, коли ти заходиш в Instagram, TikTok чи Telegram. Це робить автоматизація в «Командах» на iPhone.</p>'+
      '<ol class="steps"><li>«Команди» → «Автоматизація» → «+» → «Застосунок».</li><li>Вибери Instagram, TikTok, Telegram, познач «Відкрито» і «Запускати одразу».</li><li>Дія «Відкрити URL» з посиланням на цю сторінку. Якщо в кінці дописати <code>#instagram</code>, <code>#tiktok</code> чи <code>#telegram</code>, сторінка покаже, який застосунок чекає.</li></ol>'+
      '<h3>Щоб не вискакувало по колу</h3><p>Сторінка вискакує щоразу, коли заходиш у застосунок. Але після відповіді ти повертаєшся в Instagram, і автоматизація спрацює знову, без кінця. Тому перед «Відкрити URL» додай перевірку: якщо слово було менше ніж 2 хвилини тому, пропустити.</p>'+
      '<ol class="steps"><li>«Отримати файл» (Get File): шлях <code>slovo.txt</code>, вимкни помилку, якщо файлу немає.</li><li>«Якщо» файл має будь-яке значення: «Отримати час між датами» від файлу до поточної дати в хвилинах. Якщо менше 2, «Зупинити цю команду».</li><li>Після цього збережи поточну дату у <code>slovo.txt</code> із заміною і тоді «Відкрити URL».</li></ol>'+
      '<button class="btn ghost" type="button" data-close>Зрозуміло</button>';
  }
  $('#sheet').hidden=false;
}
function closeSheet(){$('#sheet').hidden=true;$('#sheet-body').innerHTML=''}
function pause(until,reason){state.pausedUntil=until;state.pauseReason=reason;save();closeSheet();render()}

document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close]');if(!el)return;
  const t=state.current;
  if(el.hasAttribute('data-close'))return closeSheet();
  if(el.dataset.open)return openSheet(el.dataset.open);
  if(el.dataset.say)return say(el.dataset.say);
  if(el.dataset.off){
    let until=Date.now()+60*MIN;
    if(el.dataset.off==='morning'){const d=new Date();d.setHours(7,0,0,0);if(d<=new Date())d.setDate(d.getDate()+1);until=d.getTime()}
    $('#sheet-body').innerHTML='<h2>Точно?</h2><p>Слова не вискакуватимуть до '+fmtTime(until)+'.</p><div class="stack"><button class="btn danger" type="button" id="sure" data-until="'+until+'" lang="en">I am sure</button><button class="btn ghost" type="button" data-close>Ні, залишити</button></div>';
    return;
  }
  switch(el.id){
    case 'call':return pause(Date.now()+30*MIN,'call');
    case 'off':return openSheet('off');
    case 'sure':return pause(+el.dataset.until,'off');
    case 'share':{
      const url=SITE||location.href.split('#')[0],out=$('#share-fb');
      const text='Вчимо по 2 англійські слова на день, у всіх однакові. Сьогодні: '+todayWords().map(x=>x.key).join(', ')+'.';
      const show=m=>{out.className='feedback ok';out.textContent=m};
      if(navigator.share){navigator.share({title:'Одне слово',text,url}).catch(()=>{});return}
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>show('Посилання скопійовано: '+url),()=>show(url));else show(url);
      return;
    }
    case 'resume':state.pausedUntil=0;save();return render();
    case 'more':view='task';lastResult=null;return render();
    case 'undo':if(t&&t.placed&&t.placed.length){t.placed.pop();fb=null;save();render()}return;
  }
  if(el.classList.contains('tile')&&t&&t.tiles){
    const i=+el.dataset.i;if(t.placed.includes(i))return;
    t.placed.push(i);fb=null;
    if(t.placed.length===t.tiles.length){
      const w=findWord(t.key),word=t.placed.map(k=>t.tiles[k]).join('');
      if(w.en.some(v=>v.toLowerCase()===word))return complete(t,'');
      return fail(t,w);
    }
    save();render();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='gap'){state.gap=+e.target.value;save()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f'){
    const t=state.current,w=findWord(t.key),val=$('#ans').value;
    if(!val.trim())return;
    const intro=t.kind==='intro';
    const r=match(val,intro?w.ua:w.en,intro?'uk':'en');
    if(r===2)return complete(t,'');
    if(r===1)return complete(t,'Зараховано з однією помилкою. Правильно: '+(intro?w.ua[0]:w.key)+'.');
    return fail(t,w);
  }
  if(e.target.id==='add'){
    const en=norm($('#add-en').value,'en'),ua=$('#add-ua').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const out=$('#add-fb');
    if(!en||!ua.length){out.className='feedback bad';out.textContent='Заповни обидва поля.';return}
    if(findWord(en)){out.className='feedback bad';out.textContent='Слово «'+en+'» вже є у словнику.';return}
    state.custom.unshift([en,ua.join('|')]);state.w[en]={s:1,next:Date.now()};save();openSheet('dict');
    const f=$('#add-fb');f.className='feedback ok';f.textContent='Додано «'+en+'». Воно з’явиться наступним завданням.';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
window.addEventListener('hashchange',render);
render();
})();
</script>

</body>
