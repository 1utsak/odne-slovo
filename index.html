html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;padding-block:16px 24px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px}

.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#gate{flex:1;display:flex;flex-direction:column;gap:16px}
.from{margin:0;font-size:15px;color:var(--muted)}
.from strong{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:5px}

.prompt{display:flex;flex-direction:column;gap:10px}
.lang{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.answer-form{display:flex;flex-direction:column;gap:12px}

.small{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.done{align-items:flex-start}

.links{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}

['ambiguous','неоднозначний|двозначний'],['diligent','старанний|працьовитий|ретельний'],
['peculiar','дивний|особливий|своєрідний'],['zealous','завзятий|ревний|палкий'],
['frantic','несамовитий|шалений|гарячковий'],['thrilled','у захваті|в захваті|радий'],
['gloomy','похмурий|понурий|сумний'],['tedious','нудний|виснажливий|стомливий'],
['sincere','щирий|відвертий'],['nuance','нюанс|відтінок'],
['cozy|cosy','затишний'],['impulsive','імпульсивний|поривчастий']

const ICON_SPEAK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return {turn:{d:-1,i:0},count:{d:-1,n:{}},current:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return Object.assign(defaults(),s)}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=load(), view='task', fb=null, last=null;

function toWord([en,ua]){const e=en.split('|');return {key:e[0],en:e,ua:ua.split('|')}}
// Day 0 is 2 Nov 2026; everyone gets the same three words on the same calendar day.
function dayNum(){const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,10,2))/DAY)}
function dayWords(n){const L=BASE.length,m=i=>((i%L)+L)%L;return [0,1,2].map(j=>toWord(BASE[m(PER_DAY*n+j)]))}
function todayWords(){return dayWords(dayNum())}
function findWord(k){return todayWords().find(x=>x.key===k)}
function app(){return APPS[location.hash.slice(1).toLowerCase()]||null}
function fmtDate(ts){return new Date(ts).toLocaleDateString('uk-UA',{day:'numeric',month:'long'})}
function plural(n,one,few,many){const a=n%10,b=n%100;return a===1&&b!==11?one:(a>=2&&a<=4&&(b<12||b>14))?few:many}
function counts(){return state.count.d===dayNum()?state.count.n:{}}

function norm(s){return String(s).toLowerCase().normalize('NFC').replace(/[’‘`ʼ]/g,"'").replace(/[.,!?;:"«»()\-–—]/g,' ').replace(/\s+/g,' ').trim().replace(/^(to|a|an|the) /,'')}
function shuffle(arr){
  const src=arr.join('');let a=arr.slice();
  for(let k=0;k<12;k++){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.join('')!==src)break}
  return a;
}
function say(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

// Each visit takes the next of today's three words: 1, 2, 3, 1, 2, 3...
function pick(){
  const d=dayNum();
  if(state.turn.d!==d)state.turn={d,i:0};
  const w=todayWords()[state.turn.i%PER_DAY];
  return {key:w.key,step:1,fails:0,revealed:false,meme:0};
}
function finish(t){
  const d=dayNum();
  if(state.count.d!==d)state.count={d,n:{}};
  state.count.n[t.key]=(state.count.n[t.key]||0)+1;
  state.turn.i++;state.current=null;fb=null;memeFails=0;last=findWord(t.key);view='done';save();render();
  window.scrollTo(0,0);
}
function fail(t,w){
  t.fails++;
  if(t.step===1)fb={cls:'bad',text:'Не збігається. Перепиши слово точно, як вище.'};
  else{
    t.placed=[];
    if(t.fails>=2&&!t.revealed){t.revealed=true;fb={cls:'bad',text:'Ось правильне слово. Склади його, щоб пройти далі.'}}
    else fb={cls:'bad',text:'Не те. Починається на «'+w.key[0]+'», '+w.key.length+' '+plural(w.key.length,'літера','літери','літер')+'.'};
  }
  save();render();
  const c=$('#gate .card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  const inp=$('#ans');if(inp)inp.focus();
}

function updateMeta(){
  const total=Object.values(counts()).reduce((a,b)=>a+b,0);
  $('#meta').textContent='слова дня № '+(dayNum()+1)+' · сьогодні '+total;
}
// Stickers are muted looping mp4s; pictures and gifs are images.
function mediaTag(src,attrs,alt){
  return /\.mp4$/.test(src)?'<video '+attrs+' src="'+esc(src)+'" autoplay muted loop playsinline aria-label="'+alt+'"></video>'
    :'<img '+attrs+' src="'+esc(src)+'" alt="'+alt+'" referrerpolicy="no-referrer">';
}
let memeFails=0;
function memeHTML(w,i){
  const list=MEMES[w.key]||[];if(!list.length||memeFails>=list.length)return '';
  return '<figure class="meme">'+mediaTag(list[i%list.length],'id="meme-img"','Смішна картинка до слова '+esc(w.key))+
    (list.length>1?'<button type="button" class="other" id="other">Інша картинка</button>':'')+'</figure>';
}
function render(){
  updateMeta();
  const gate=$('#gate');
  if(view==='done'&&last){
    const a=app()||APPS.instagram,n=counts()[last.key]||1;
    const run=(name,text)=>'shortcuts://run-shortcut?name='+encodeURIComponent(name)+(text?'&input=text&text='+encodeURIComponent(text):'');
    gate.innerHTML='<div class="card done"><div class="tick">'+ICON_CHECK+'</div><h2 class="done-title">Зараховано</h2><p class="recap"><span lang="en">'+esc(last.key)+'</span> — '+esc(last.ua[0])+'</p><p class="hint">Сьогодні це слово пройдено '+n+' '+plural(n,'раз','рази','разів')+'.</p></div>'+
      '<div class="stack"><a class="btn" href="'+run(DONE_SHORTCUT,a.url)+'">Відкрити '+esc(a.name)+'</a><a class="btn ghost" href="'+run(HOME_SHORTCUT)+'">Закрити '+esc(a.name)+'</a></div>';
    return;
  }
  if(!state.current||!findWord(state.current.key)){state.current=pick();save()}
  const t=state.current,w=findWord(t.key),a=app();
  const from=a?'<p class="from">Перед тим як відкрити <strong>'+esc(a.name)+'</strong>, одне слово.</p>':'<p class="from">Одне слово, і можна далі.</p>';
  const dots='<span class="dots">'+[1,2].map(i=>'<i class="'+(i<=t.step?'on':'')+'"></i>').join('')+'</span>';
  const label=t.step===1?'Крок 1 з 2 · запам’ятай':'Крок 2 з 2 · з літер';
  const listen='<button type="button" class="listen" data-say="'+esc(w.key)+'">'+ICON_SPEAK+'<span>Послухати</span></button>';
  let body;
  if(t.step===1){
    body=memeHTML(w,t.meme)+'<div class="prompt"><div class="word" lang="en">'+esc(w.key)+'</div><div class="row">'+listen+'</div><div class="gloss">'+esc(w.ua.join(', '))+'</div></div>'+
      '<form id="f" class="answer-form" autocomplete="off"><label class="task" for="ans">Напиши це слово англійською</label>'+
      '<input id="ans" class="answer" type="text" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="англійською">'+
      '<button class="btn" type="submit">Далі</button></form>';
  }else{
    if(!t.tiles){t.tiles=shuffle(w.key.split(''));t.placed=[];save()}
    const slots=t.tiles.map((_,i)=>t.placed[i]!==undefined?'<span class="slot filled">'+esc(t.tiles[t.placed[i]])+'</span>':'<span class="slot"></span>').join('');
    const tiles=t.tiles.map((ch,i)=>'<button type="button" class="tile" data-i="'+i+'"'+(t.placed.includes(i)?' disabled':'')+' aria-label="Літера '+esc(ch)+'">'+esc(ch)+'</button>').join('');
    const reveal=t.revealed?'<div class="reveal"><span class="lang">правильно</span><strong lang="en">'+esc(w.key)+'</strong>'+listen+'</div>':'';
    body='<div class="prompt"><div class="lang">українською</div><div class="word">'+esc(w.ua[0])+'</div></div>'+memeHTML(w,t.meme)+
      '<p class="task">Склади це слово англійською</p>'+reveal+'<div class="slots" aria-label="Твоє слово">'+slots+'</div><div class="tiles">'+tiles+'</div>'+
      '<div class="row"><button type="button" class="btn ghost small" id="undo">Стерти літеру</button></div>';
  }
  gate.innerHTML=from+'<div class="card"><div class="step"><span>'+label+'</span>'+dots+'</div>'+body+'<p class="feedback'+(fb?' '+fb.cls:'')+'" role="status">'+(fb?esc(fb.text):'')+'</p></div>';
  const img=$('#meme-img');
  if(img)img.addEventListener('error',()=>{memeFails++;t.meme++;save();rerender()});
}

// Re-render without losing what was typed in step 1.
function rerender(){const a=$('#ans'),v=a?a.value:'';render();const b=$('#ans');if(v&&b)b.value=v}

/* sheets */
function openSheet(name){
  const b=$('#sheet-body');
  if(name==='dict'){
    const n=dayNum(),c=counts();
    const li=x=>{const m=(MEMES[x.key]||[])[0],k=c[x.key]||0;
      return '<li>'+(m?mediaTag(m,'class="thumb"',''):'<span class="thumb"></span>')+
        '<span class="li-en" lang="en">'+esc(x.en.join(' / '))+'</span><span class="li-ua">'+esc(x.ua.join(', '))+'</span><span class="chip'+(k?' go':'')+'">'+k+' '+plural(k,'раз','рази','разів')+'</span></li>'};
    let past='';
    for(let k=n-1;k>=Math.max(0,n-14);k--)past+='<li><b>№ '+(k+1)+' · '+fmtDate(Date.now()-(n-k)*DAY)+'</b>'+dayWords(k).map(x=>esc(x.key)).join(', ')+'</li>';
    b.innerHTML='<h2>Слова дня № '+(n+1)+'</h2><p class="hint">'+fmtDate(Date.now())+'. Сьогодні в усіх ці самі три слова. Кожен вхід дає наступне з них по колу.</p><ul class="list">'+todayWords().map(li).join('')+'</ul>'+
      '<button class="btn" type="button" id="share">Поділитися з друзями</button><p class="feedback" id="share-fb" role="status"></p>'+
      (past?'<h3>Минулі дні</h3><ul class="past">'+past+'</ul>':'')+
      '<button class="btn ghost" type="button" data-close>Закрити</button>';
  }else{
    b.innerHTML='<h2>Як підключити</h2><p>Робиться один раз у застосунку «Команди» на iPhone: дві маленькі команди й автоматизація.</p>'+
      '<h3>1. Команда «'+DONE_SHORTCUT+'»</h3><ol class="steps"><li>«Команди» → «+». Назва точно <code>'+DONE_SHORTCUT+'</code>.</li><li>Дія «Текст» зі змінною «Поточна дата». Торкнись змінної й вибери формат ISO 8601 з часом.</li><li>«Зберегти файл» (Save File): шлях <code>slovo.txt</code>, вимкни «Запитувати, куди зберегти», увімкни «Замінити».</li><li>«Відкрити URL» (Open URLs) зі змінною «Вхідні дані команди» (Shortcut Input).</li></ol>'+
      '<h3>2. Команда «'+HOME_SHORTCUT+'»</h3><ol class="steps"><li>Нова команда, назва точно <code>'+HOME_SHORTCUT+'</code>, одна дія «На головний екран» (Go to Home Screen).</li></ol>'+
      '<h3>3. Автоматизація</h3><ol class="steps"><li>«Автоматизація» → «+» → «Застосунок» → Instagram, «Відкрито», «Запускати одразу».</li><li>«Отримати файл» (Get File): шлях <code>slovo.txt</code>, вимкни помилку, якщо файлу немає.</li><li>«Якщо» файл має будь-яке значення: «Отримати час між датами» від файлу до поточної дати в секундах. Усередині ще одне «Якщо» менше 30 → «Зупинити цю команду».</li><li>Після обох «Якщо»: «Відкрити URL» <code>'+SITE+'#instagram</code>.</li><li>Так само для TikTok з <code>#tiktok</code> і Telegram з <code>#telegram</code>.</li></ol>'+
      '<p class="hint">30 секунд потрібні лише для того, щоб кнопка «Відкрити Instagram» не запускала слово знову. Наступний вхід уже дає нове слово.</p>'+
      '<p class="hint">Перший раз Safari спитає, чи відкрити «Команди»: натисни «Відкрити». Щоб вкладки не накопичувались: Параметри → Safari → «Закривати вкладки» → «Через день».</p>'+
      '<button class="btn ghost" type="button" data-close>Зрозуміло</button>';
  }
  $('#sheet').hidden=false;
}
function closeSheet(){$('#sheet').hidden=true;$('#sheet-body').innerHTML=''}

document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close]');if(!el)return;
  const t=state.current;
  if(el.hasAttribute('data-close'))return closeSheet();
  if(el.dataset.open)return openSheet(el.dataset.open);
  if(el.dataset.say)return say(el.dataset.say);
  if(el.id==='other'&&t){t.meme++;save();return rerender()}
  if(el.id==='undo'&&t&&t.placed&&t.placed.length){t.placed.pop();fb=null;save();return render()}
  if(el.id==='share'){
    const url=SITE,out=$('#share-fb');
    const text='Вчимо по 3 англійські слова на день, у всіх однакові. Сьогодні: '+todayWords().map(x=>x.key).join(', ')+'.';
    const show=m=>{out.className='feedback ok';out.textContent=m};
    if(navigator.share){navigator.share({title:'Одне слово',text,url}).catch(()=>{});return}
    if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>show('Посилання скопійовано: '+url),()=>show(url));else show(url);
    return;
  }
  if(el.classList.contains('tile')&&t&&t.tiles){
    const i=+el.dataset.i;if(t.placed.includes(i))return;
    t.placed.push(i);fb=null;
    if(t.placed.length===t.tiles.length){
      const w=findWord(t.key),word=t.placed.map(k=>t.tiles[k]).join('');
      if(w.en.some(v=>v.toLowerCase()===word))return finish(t);
      return fail(t,w);
    }
    save();render();
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id!=='f')return;
  const t=state.current,w=findWord(t.key),val=$('#ans').value;
  if(!val.trim())return;
  if(!w.en.some(v=>norm(v)===norm(val)))return fail(t,w);
  t.step=2;t.fails=0;t.tiles=null;fb={cls:'ok',text:'Є. Тепер без підказки.'};save();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
window.addEventListener('hashchange',render);
render();
})();
</script>
